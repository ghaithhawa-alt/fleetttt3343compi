<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FleetCompliance – Admin</title>
<link rel="stylesheet" href="/app/assets/fonts.css">
<style>
  :root{
    --bg:#0a0a0a;--surface:#111;--surface2:#141414;
    --line:rgba(255,255,255,.07);--line2:rgba(255,255,255,.12);
    --gruen:#10b981;--gruen-d:#0ea372;--auf-gruen:#06281e;
    --text:#fafafa;--text2:#a1a1aa;--text3:#71717a;--text4:#52525b;
    --rot:#f87171;
    --sans:'Inter',system-ui,-apple-system,sans-serif;
    --mono:'JetBrains Mono','SF Mono',monospace;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--text);font-family:var(--sans);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}

  /* Layout: Seitenleiste + Inhalt */
  .a-wrap{display:grid;grid-template-columns:240px 1fr;min-height:100vh}
  @media(max-width:820px){.a-wrap{grid-template-columns:1fr}}

  /* Seitenleiste */
  .a-side{background:var(--surface);border-right:1px solid var(--line);display:flex;flex-direction:column;padding:16px 0;position:sticky;top:0;height:100vh}
  .a-brand{padding:0 18px 16px;font-size:15px;font-weight:700;display:flex;align-items:center;gap:8px}
  .a-brand b{color:var(--gruen)}
  .a-brand .a-super{font-size:9px;background:rgba(16,185,129,.15);color:var(--gruen);padding:2px 7px;border-radius:5px;font-weight:600}
  .a-group{padding:14px 18px 6px;font-size:9px;letter-spacing:.08em;color:var(--text4);text-transform:uppercase;font-weight:600}
  .a-nav{display:flex;align-items:center;gap:10px;padding:9px 18px;margin:0 8px;border-radius:9px;cursor:pointer;color:var(--text2);font-size:13px;border:none;background:transparent;width:calc(100% - 16px);text-align:left;font-family:var(--sans);transition:background .12s,color .12s}
  .a-nav:hover{background:rgba(255,255,255,.03);color:var(--text)}
  .a-nav.active{background:var(--gruen);color:var(--auf-gruen);font-weight:600}
  .a-nav svg{width:17px;height:17px;flex-shrink:0}
  .a-nav-logout{color:var(--rot)}
  .a-nav-logout:hover{background:rgba(248,113,113,.08);color:var(--rot)}
  .a-side-foot{margin-top:auto;padding:14px 18px 0;font-size:11px;color:var(--text4);border-top:1px solid var(--line)}

  /* Inhalt */
  .a-main{padding:28px 32px;overflow-y:auto}
  .a-title{font-size:22px;font-weight:700;letter-spacing:-.01em;margin-bottom:22px}

  /* Kennzahlen-Karten */
  .a-kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:22px}
  @media(max-width:700px){.a-kpis{grid-template-columns:1fr}}
  .a-kpi{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:20px 22px}
  .a-kpi-label{font-size:12px;color:var(--text3);margin-bottom:10px}
  .a-kpi-value{font-size:30px;font-weight:700;color:var(--text);font-family:var(--mono)}
  .a-kpi-green{color:var(--gruen)}

  /* Tabelle / Karten */
  .a-card{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
  .a-card-head{padding:16px 20px;font-size:14px;font-weight:600;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between}
  .a-table{width:100%;border-collapse:collapse}
  .a-table th{text-align:left;font-size:10px;letter-spacing:.04em;text-transform:uppercase;color:var(--text3);font-weight:600;padding:11px 20px;border-bottom:1px solid var(--line)}
  .a-table td{padding:13px 20px;font-size:13px;color:var(--text2);border-bottom:1px solid var(--line)}
  .a-table tr:last-child td{border-bottom:none}
  .a-table td.a-em{color:var(--text);font-weight:500}
  .a-mono{font-family:var(--mono)}
  .a-badge{font-size:10.5px;padding:3px 9px;border-radius:20px;background:rgba(255,255,255,.06);color:var(--text3)}
  .a-badge-green{background:rgba(16,185,129,.12);color:var(--gruen)}
  .a-badge-red{background:rgba(248,113,113,.12);color:var(--rot)}

  /* Buttons */
  .a-btn{background:transparent;border:1px solid var(--line2);border-radius:8px;padding:7px 13px;color:var(--text2);font-size:12px;font-weight:600;cursor:pointer;font-family:var(--sans);transition:border-color .15s,color .15s;text-decoration:none;display:inline-block}
  .a-btn:hover{border-color:var(--gruen);color:var(--gruen)}
  .a-btn-green{background:var(--gruen);border-color:var(--gruen);color:var(--auf-gruen)}
  .a-btn-green:hover{background:var(--gruen-d);color:var(--auf-gruen)}
  .a-btn-red{color:var(--rot);border-color:rgba(248,113,113,.3)}
  .a-btn-red:hover{border-color:var(--rot);color:var(--rot)}

  /* Kommt-bald */
  .a-soon{background:var(--surface);border:1px dashed var(--line2);border-radius:14px;padding:60px 24px;text-align:center}
  .a-soon h3{font-size:16px;color:var(--text2);margin-bottom:8px}
  .a-soon p{font-size:13px;color:var(--text3);max-width:400px;margin:0 auto}

  /* Kein-Zugriff */
  .a-denied{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;text-align:center;gap:12px}
  .a-denied h2{font-size:20px;color:var(--rot)}
  .a-denied a{color:var(--gruen)}

  .a-hidden{display:none!important}

  /* Formular / Dialog */
  .a-form-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;padding:20px}
  .a-field label{display:block;font-size:11.5px;color:var(--text2);margin-bottom:6px;font-weight:500}
  .a-field input,.a-field select{width:100%;height:38px;background:#0d0d0d;border:1px solid var(--line2);border-radius:9px;color:var(--text);padding:0 11px;font-size:13px;font-family:var(--sans)}
  .a-field input:focus,.a-field select:focus{outline:none;border-color:var(--gruen)}
  .a-hinweis{display:block;font-size:11px;color:var(--text4);margin-top:5px;line-height:1.4}
  .a-mods{display:flex;flex-wrap:wrap;gap:8px}
  .a-mod-chip{font-size:11.5px;padding:6px 11px;border-radius:8px;border:1px solid var(--line2);color:var(--text3);cursor:pointer;background:transparent}
  .a-mod-chip.on{background:rgba(16,185,129,.12);border-color:rgba(16,185,129,.35);color:var(--gruen)}
  .a-msg{font-size:12px;margin:8px 20px;min-height:16px}
  .a-msg.err{color:var(--rot)}
  .a-msg.ok{color:var(--gruen)}

  /* Detail-Fenster (Bearbeiten) */
  #aDetailHost{display:none;position:fixed;inset:0;z-index:9999}
  .a-modal-backdrop{position:absolute;inset:0;background:rgba(0,0,0,.65)}
  .a-modal{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
    width:100%;max-width:560px;max-height:88vh;overflow-y:auto;
    background:var(--surface2);border:1px solid var(--line2);border-radius:16px;padding:24px}
  .a-modal-head{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin-bottom:8px}
  .a-modal-title{font-size:18px;font-weight:700;color:var(--text)}
  .a-modal-sub{font-size:12px;color:var(--text3);margin-top:3px;font-family:var(--mono)}
  .a-modal-sec{font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--text3);font-weight:600;margin:20px 0 12px;padding-bottom:6px;border-bottom:1px solid var(--line)}
  .a-modal-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  .a-textarea{width:100%;min-height:70px;background:#0d0d0d;border:1px solid var(--line2);border-radius:9px;color:var(--text);padding:10px 12px;font-size:13px;font-family:var(--sans);resize:vertical}
  .a-textarea:focus{outline:none;border-color:var(--gruen)}
  .a-modal-actions{display:flex;align-items:center;gap:10px;margin-top:22px}
  .a-ph-leiste{display:flex;flex-wrap:wrap;align-items:center;gap:5px;margin-bottom:10px;
    padding:10px;background:rgba(255,255,255,.02);border:1px solid var(--line);border-radius:9px}
  .a-ph-titel{font-size:11px;color:var(--text3);margin-right:4px}
  .a-ph{background:rgba(16,185,129,.10);border:1px solid rgba(16,185,129,.25);color:var(--gruen);
    font-family:var(--mono);font-size:11px;padding:3px 8px;border-radius:6px;cursor:pointer}
  .a-ph:hover{background:rgba(16,185,129,.20)}
  .a-ph-blau{background:rgba(96,165,250,.10);border-color:rgba(96,165,250,.3);color:#60a5fa}
  .a-ph-blau:hover{background:rgba(96,165,250,.2)}
</style>
</head>
<body>
<!-- Kein-Zugriff -->
<div id="aDenied" class="a-denied a-hidden">
  <h2>Kein Zugriff</h2>
  <p style="color:var(--text3)">Dieser Bereich ist nur für Superadmins.</p>
  <a href="/app/dashboard">Zurück zur App</a>
</div>

<!-- Haupt-Layout -->
<div class="a-wrap" id="aWrap">
  <aside class="a-side">
    <div class="a-brand">Fleet<b>Compliance</b><span class="a-super">SUPER</span></div>

    <div class="a-group">Admin</div>
    <button class="a-nav active" data-view="uebersicht"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg><span>Übersicht</span></button>
    <button class="a-nav" data-view="firmen"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/></svg><span>Firmen &amp; Benutzer</span></button>
    <button class="a-nav" data-view="lizenzen"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="5" width="20" height="14" rx="2"/><line x1="2" y1="10" x2="22" y2="10"/></svg><span>Lizenzen</span></button>
    <button class="a-nav" data-view="nachrichten"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 4h16v12H5.17L4 17.17z"/></svg><span>Nachrichten</span></button>
    <button class="a-nav" data-view="support"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 18v-6a9 9 0 0 1 18 0v6"/><path d="M21 19a2 2 0 0 1-2 2h-1a2 2 0 0 1-2-2v-3a2 2 0 0 1 2-2h3zM3 19a2 2 0 0 0 2 2h1a2 2 0 0 0 2-2v-3a2 2 0 0 0-2-2H3z"/></svg><span>Support</span></button>

    <div class="a-group">Superadmin</div>
    <button class="a-nav" data-view="einnahmen"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="1" x2="12" y2="23"/><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg><span>Einnahmen</span></button>
    <button class="a-nav" data-view="preise"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20.59 13.41l-7.17 7.17a2 2 0 0 1-2.83 0L2 12V2h10l8.59 8.59a2 2 0 0 1 0 2.82z"/><line x1="7" y1="7" x2="7.01" y2="7"/></svg><span>Preise</span></button>
    <button class="a-nav" data-view="vorlagen"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg><span>Vorlagen</span></button>
    <button class="a-nav" data-view="rollen"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg><span>Rollen</span></button>

    <div class="a-group">Konto</div>
    <a class="a-nav" href="/app/dashboard"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg><span>Zur App</span></a>
    <button class="a-nav a-nav-logout" onclick="logout()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg><span>Abmelden</span></button>

    <div class="a-side-foot" id="aFoot">–</div>
  </aside>

  <main class="a-main">
    <div id="aViews"></div>
  </main>
</div>
<script src="/app/admin-app.js"></script>
</body>
</html>
